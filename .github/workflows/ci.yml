name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          retention-days: 7
  preview-smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
      statuses: read
      issues: read
    steps:
      - name: Require a reviewed branch in this repository
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fork previews require a separately reviewed deployment workflow.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Vercel preview of this commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            for (let attempt = 0; attempt < 60; attempt++) {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner: context.repo.owner, repo: context.repo.repo, sha, per_page: 100
              });
              for (const deployment of deployments) {
                if (deployment.production_environment || !/preview/i.test(deployment.environment)) continue;
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: deployment.id
                });
                const status = statuses[0];
                if (status?.state === 'success' && status.environment_url) {
                  const url = new URL(status.environment_url);
                  if (url.protocol !== 'https:' || !url.hostname.endsWith('.vercel.app')) continue;
                  core.setOutput('url', url.origin);
                  return;
                }
              }
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha
              });
              const ready = combined.statuses.find(s => s.context === 'Vercel' && s.state === 'success');
              if (ready?.target_url?.startsWith('https://vercel.com/mhrsuporteti-5479/jairobahia/')) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, per_page: 100
                });
                for (const comment of comments.filter(c => c.user?.login === 'vercel[bot]')) {
                  const row = comment.body?.split('\n').find(line => line.includes('](' + ready.target_url + ')'));
                  const preview = row?.match(/\[Preview\]\((https:\/\/[^)]+)\)/)?.[1];
                  if (!preview) continue;
                  const url = new URL(preview);
                  if (!url.hostname.endsWith('-mhrsuporteti-5479.vercel.app')) continue;
                  core.setOutput('url', url.origin);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('No successful Vercel preview confirmed for PR head SHA. Check Git integration and deployment logs.');
      - name: Validate deployed preview
        run: node scripts/smoke-preview.mjs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
